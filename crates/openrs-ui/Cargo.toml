[package]
name = "openrs-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
# The shared UI surface is egui/egui_kittest based across the desktop and web
# targets so layout-independent behavior can be tested without another copy of
# the widgets.
egui = "0.32"
openrs-core = { path = "../openrs-core", features = ["egui"] }

[dev-dependencies]
openrs-core = { path = "../openrs-core", features = ["egui"] }
egui_kittest = "0.37"
